<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Tester.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%;
      font-family: 'Montserrat', sans-serif;
      background: #121419;
      color: #E8E8ED;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .bg-video {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden;
    }
    .bg-video video {
      width: 100vw; height: 100vh; object-fit: cover;
      opacity: 0.3; filter: saturate(0.7) brightness(0.8);
    }
    .bg-video-overlay {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(198,165,89,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(198,165,89,0.03) 0%, transparent 50%),
        linear-gradient(180deg, rgba(18,20,25,0.3) 0%, rgba(18,20,25,0.1) 50%, rgba(18,20,25,0.4) 100%);
    }

    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .text-gold {
      background: linear-gradient(135deg, #E6B979 0%, #C6A559 50%, #E6B979 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .container {
      position: relative; z-index: 2;
      text-align: center; padding: 40px;
      max-width: 560px;
      animation: fadeInUp 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkmark-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #C6A559, #E6B979);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 0 12px 40px rgba(198,165,89,0.25);
      animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .checkmark-circle svg {
      animation: drawCheck 0.4s ease 0.7s both;
    }
    @keyframes drawCheck {
      from { stroke-dashoffset: 30; opacity: 0; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    h1 {
      font-weight: 900; font-size: 42px;
      letter-spacing: -0.03em; margin-bottom: 16px;
      line-height: 1.1;
    }
    p {
      font-size: 16px; line-height: 1.7;
      color: rgba(232,232,237,0.5); font-weight: 500;
      margin-bottom: 12px;
    }
    .detail {
      font-size: 13px; color: rgba(232,232,237,0.35);
      margin-bottom: 40px;
    }

    .btn-gold {
      display: inline-block;
      background: linear-gradient(135deg, #B8952E 0%, #C6A559 30%, #E6B979 60%, #D4AB4C 100%);
      color: #1A1206; font-weight: 700; font-size: 13px;
      letter-spacing: 0.12em; text-decoration: none;
      text-transform: uppercase;
      padding: 14px 36px; border-radius: 8px;
      border: 1px solid rgba(230,185,121,0.4);
      box-shadow: 0 2px 12px rgba(198,165,89,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    .btn-gold:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(198,165,89,0.35), 0 2px 8px rgba(198,165,89,0.25);
    }
    .btn-gold:focus-visible { outline: 2px solid #E6B979; outline-offset: 4px; }
    .btn-gold:active { transform: translateY(0); }

    .btn-outline {
      display: inline-block;
      border: 1.5px solid #C6A559; color: #E6B979;
      font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-decoration: none;
      text-transform: uppercase;
      padding: 14px 36px; border-radius: 8px;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.25s ease;
    }
    .btn-outline:hover {
      transform: translateY(-3px);
      background: rgba(198,165,89,0.1);
    }
    .btn-outline:focus-visible { outline: 2px solid #E6B979; outline-offset: 4px; }
    .btn-outline:active { transform: translateY(0); }

    .sparkle {
      position: fixed; width: 3px; height: 3px; border-radius: 50%;
      background: radial-gradient(circle, rgba(230,185,121,0.9), transparent);
      animation: sparkle 3s ease-in-out infinite; pointer-events: none; z-index: 1;
    }
    .sparkle-lg { width: 5px; height: 5px; box-shadow: 0 0 8px rgba(230,185,121,0.4); }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

<!-- Background video -->
<div class="bg-video">
  <video muted playsinline autoplay loop preload="auto">
    <source src="brand_assets/bg-video.mp4" type="video/mp4" />
  </video>
  <div class="bg-video-overlay"></div>
</div>

<!-- Grain -->
<div class="grain"></div>

<!-- Sparkles -->
<div class="sparkle" style="top:15%;left:20%;animation-delay:0.3s;"></div>
<div class="sparkle sparkle-lg" style="top:25%;right:18%;animation-delay:1.1s;"></div>
<div class="sparkle" style="bottom:20%;left:30%;animation-delay:0.8s;"></div>
<div class="sparkle sparkle-lg" style="bottom:30%;right:25%;animation-delay:2.0s;"></div>
<div class="sparkle" style="top:40%;left:10%;animation-delay:1.6s;"></div>
<div class="sparkle sparkle-lg" style="top:10%;right:35%;animation-delay:0.5s;"></div>

<!-- Content -->
<div class="container">
  <div class="checkmark-circle">
    <svg width="40" height="40" fill="none" stroke="#0A0A0F" stroke-width="3" viewBox="0 0 24 24" stroke-dasharray="30" stroke-dashoffset="0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1>Thank <span class="text-gold">You!</span></h1>
  <p>Your message has been received successfully. Our team will review it and get back to you shortly.</p>
  <p class="detail">Expect a response within 24 hours.</p>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    <a href="index.html" class="btn-gold">Back to Home</a>
    <a href="index.html#pricing" class="btn-outline">View Pricing</a>
  </div>
</div>

</body>
</html>
