<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Tester.io</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C6A559;--gold-light:#E6B979;--bg:#0e0d11;--bg2:#17161b;--text:#e8e4dd;--text-dim:#8a857c}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(14,13,17,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(198,165,89,.1)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{height:28px}
.nav-brand span{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold)}
.nav-back{font-size:.85rem;color:var(--text-dim);text-decoration:none;transition:.3s}
.nav-back:hover{color:var(--gold)}

/* Header */
.header{text-align:center;padding:120px 40px 48px}
.header h1{font-family:'Playfair Display',serif;font-size:3rem;background:linear-gradient(135deg,var(--gold),var(--gold-light),#fff,var(--gold));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s ease infinite}
.header p{color:var(--text-dim);margin-top:8px;font-size:.9rem}
.header .count{display:inline-block;margin-top:16px;padding:6px 16px;background:rgba(198,165,89,.1);border:1px solid rgba(198,165,89,.15);border-radius:20px;font-size:.8rem;color:var(--gold);font-weight:600}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Video reel */
.reel-section{max-width:1000px;margin:0 auto 48px;padding:0 40px}
.reel-section h2{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.reel-section .dot{width:6px;height:6px;background:var(--gold);border-radius:50%}
.reel-video{width:100%;border-radius:12px;border:1px solid rgba(198,165,89,.12);overflow:hidden;background:#000}
.reel-video video{width:100%;display:block}

/* Grid */
.grid-section{max-width:1400px;margin:0 auto;padding:0 40px 80px}
.grid-section h2{font-size:1.1rem;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px}
.card{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(198,165,89,.08);background:var(--bg2);transition:border-color .3s,transform .3s}
.card:hover{border-color:rgba(198,165,89,.25);transform:translateY(-4px)}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;object-position:top}
.card-info{padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.card-info .label{font-size:.85rem;font-weight:600}
.card-info .badge{font-size:.7rem;padding:3px 10px;border-radius:12px;background:rgba(198,165,89,.1);color:var(--gold);font-weight:600}
.card a{position:absolute;inset:0;z-index:1}

/* Footer */
footer{text-align:center;padding:40px;font-size:.75rem;color:rgba(232,232,237,.2);border-top:1px solid rgba(198,165,89,.06)}

@media(max-width:768px){
  .header{padding:90px 16px 32px}
  .header h1{font-size:2rem}
  .grid{grid-template-columns:1fr}
  .grid-section,.reel-section{padding:0 16px 48px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <img src="brand_assets/Tester Logo.png" alt="Tester.io">
    <span>Tester.io</span>
  </div>
  <a href="index.html" class="nav-back">&larr; Back to Home</a>
</nav>

<header class="header">
  <h1>Project Portfolio</h1>
  <p>All live pages from the Tester.io project</p>
  <span class="count" id="pageCount"></span>
</header>

<!-- Video Reel -->
<section class="reel-section">
  <h2><span class="dot"></span>Video Reel</h2>
  <div class="reel-video">
    <video autoplay loop muted playsinline>
      <source src="portfolio-screenshots/reel.mp4" type="video/mp4">
    </video>
  </div>
</section>

<!-- Screenshot Grid -->
<section class="grid-section">
  <h2><span class="dot"></span>All Pages</h2>
  <div class="grid" id="grid"></div>
</section>

<footer>&copy; 2026 Tester.io. All rights reserved.</footer>

<script>
const pages = [
  { name: 'index', label: 'Landing Page', url: 'index.html', badge: 'Main' },
  { name: 'sights', label: 'Sights', url: 'sights.html', badge: 'Feature' },
  { name: 'moodboard', label: 'Moodboard', url: 'moodboard.html', badge: 'Tool' },
  { name: 'dashboard', label: 'Dashboard', url: 'dashboard.html', badge: 'Admin' },
  { name: 'about', label: 'About', url: 'about.html', badge: 'Info' },
  { name: 'thank-you', label: 'Thank You', url: 'thank-you.html', badge: 'Flow' },
  { name: 'TesterTech', label: 'TesterTech', url: 'TesterTech.html', badge: 'Feature' },
  { name: 'product', label: 'Product', url: 'product.html', badge: 'Feature' },
  { name: 'creative', label: 'Creative', url: 'creative.html', badge: 'Feature' },
  { name: 'community', label: 'Community', url: 'community.html', badge: 'Info' },
  { name: 'support', label: 'Support', url: 'support.html', badge: 'Info' },
  { name: 'blog', label: 'Blog', url: 'blog.html', badge: 'Content' },
  { name: 'careers', label: 'Careers', url: 'careers.html', badge: 'Info' },
  { name: 'changelog', label: 'Changelog', url: 'changelog.html', badge: 'Content' },
  { name: 'roadmap', label: 'Roadmap', url: 'roadmap.html', badge: 'Content' },
  { name: 'privacy', label: 'Privacy', url: 'privacy.html', badge: 'Legal' },
  { name: 'terms', label: 'Terms', url: 'terms.html', badge: 'Legal' },
  { name: 'security', label: 'Security', url: 'security.html', badge: 'Legal' },
  { name: 'cookies', label: 'Cookies', url: 'cookies.html', badge: 'Legal' },
];

document.getElementById('pageCount').textContent = `${pages.length} Pages`;

const grid = document.getElementById('grid');
grid.innerHTML = pages.map(p => `
  <div class="card">
    <a href="${p.url}"></a>
    <img src="portfolio-screenshots/${p.name}.png" alt="${p.label}" loading="lazy">
    <div class="card-info">
      <span class="label">${p.label}</span>
      <span class="badge">${p.badge}</span>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
