<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sights — Burj Khalifa</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#000;
  font-family:'DM Sans', sans-serif;
  color:#fff;
  overflow:hidden;
}

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:22px 48px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,transparent 100%);
}
.nav-logo {
  font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px;
  background:linear-gradient(135deg,#C6A559,#E6B979);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-decoration:none;
}
.nav-links { display:flex; gap:28px; list-style:none; }
.nav-links a {
  text-decoration:none; color:rgba(255,255,255,0.45);
  font-size:12px; letter-spacing:2px; text-transform:uppercase; transition:color .3s;
}
.nav-links a:hover, .nav-links a.active { color:#C6A559; }

/* TWO FULL-SCREEN FRAMES */
#stage { position:fixed; inset:0; }

.frame {
  position:absolute; inset:0;
  width:100%; height:100%;
  will-change:opacity;
}
.frame img {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; object-position:center top;
  will-change:transform;
}

#f-blueprint { z-index:1; opacity:1; }
#f-built     { z-index:2; opacity:0; }

/* Vignette */
#vignette {
  position:absolute; inset:0; z-index:10; pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 45%,rgba(0,0,0,0.6) 100%);
}
#btm {
  position:absolute; bottom:0; left:0; right:0; height:40%; z-index:10; pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,0.75));
}

/* LABEL bottom-left */
#label {
  position:absolute; bottom:80px; left:48px; z-index:20;
  pointer-events:none;
}
.lbl {
  position:absolute; bottom:0; left:0;
  opacity:0; transform:translateY(12px);
  transition:opacity .7s ease, transform .7s ease;
}
.lbl.show { opacity:1; transform:translateY(0); }
.lbl-tag {
  font-size:10px; letter-spacing:4px; text-transform:uppercase;
  color:#C6A559; margin-bottom:10px;
}
.lbl h2 {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,8vw,108px);
  letter-spacing:2px; line-height:.92;
}
.lbl p {
  margin-top:14px; font-size:14px; font-weight:300;
  color:rgba(255,255,255,0.4); max-width:340px; line-height:1.7;
}
#lbl-blueprint h2 { color:rgba(190,220,255,.95); }
#lbl-built h2 {
  background:linear-gradient(135deg,#C6A559 0%,#E6B979 55%,#fff8e0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}

/* PROGRESS dots */
.prog {
  position:absolute; right:32px; top:50%; transform:translateY(-50%);
  z-index:20; display:flex; flex-direction:column; align-items:center; gap:8px;
}
.pdot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,.2); transition:background .4s, transform .4s;
}
.pdot.on { background:#C6A559; transform:scale(1.7); }
.pline { width:1px; height:22px; background:rgba(255,255,255,.07); }

/* REPLAY */
#replay {
  position:absolute; bottom:80px; right:48px; z-index:20;
  display:flex; align-items:center; gap:10px;
  border:1px solid rgba(198,165,89,.3); padding:12px 24px;
  background:rgba(0,0,0,.5); color:#C6A559;
  font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
  cursor:pointer; opacity:0; pointer-events:none; transition:opacity .6s;
}
#replay:hover { background:rgba(198,165,89,.1); border-color:#C6A559; }
#replay.show { opacity:1; pointer-events:all; }

/* Ken Burns */
@keyframes kb-blueprint { from{transform:scale(1) translate(0,0)} to{transform:scale(1.07) translate(-.5%,-.3%)} }
@keyframes kb-built     { from{transform:scale(1.04) translate(.3%,0)} to{transform:scale(1) translate(-.2%,.2%)} }

@media (max-width:768px) {
  nav { padding:16px 20px; }
  .nav-links { display:none; }
  #label { left:20px; bottom:56px; }
  .prog { right:14px; }
  #replay { right:20px; bottom:56px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">TesterTech</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="TesterTech.html">Products</a></li>
    <li><a href="creative.html">Creative</a></li>
    <li><a href="sights.html" class="active">Sights</a></li>
  </ul>
</nav>

<div id="stage">
  <div class="frame" id="f-blueprint">
    <img id="img-bp" src="https://tempfile.aiquickdraw.com/s/b2d01f0551533b98cbef0cce5e53ab41_0_1773866501_6604.png" alt="Burj Khalifa Blueprint">
  </div>
  <div class="frame" id="f-built">
    <img id="img-bu" src="https://tempfile.aiquickdraw.com/s/cb7f740290666dd3b89235f7f2fa4e86_0_1773866502_2306.png" alt="Burj Khalifa Completed">
  </div>
  <div id="vignette"></div>
  <div id="btm"></div>

  <div id="label">
    <div class="lbl" id="lbl-blueprint">
      <div class="lbl-tag">Start Frame — Blueprint</div>
      <h2>Burj<br>Khalifa</h2>
      <p>Every line a decision. The vision before it became reality.</p>
    </div>
    <div class="lbl" id="lbl-built">
      <div class="lbl-tag">End Frame — Completed</div>
      <h2>Burj<br>Khalifa</h2>
      <p>828 metres. The world's tallest structure — fully realised.</p>
    </div>
  </div>

  <div class="prog">
    <div class="pdot on" id="pd1"></div>
    <div class="pline"></div>
    <div class="pdot" id="pd2"></div>
  </div>

  <div id="replay" onclick="play()">
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M1 4v6h6M23 20v-6h-6"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Replay
  </div>
</div>

<script>
  const fBp     = document.getElementById('f-blueprint');
  const fBu     = document.getElementById('f-built');
  const imgBp   = document.getElementById('img-bp');
  const imgBu   = document.getElementById('img-bu');
  const lblBp   = document.getElementById('lbl-blueprint');
  const lblBu   = document.getElementById('lbl-built');
  const pd1     = document.getElementById('pd1');
  const pd2     = document.getElementById('pd2');
  const replay  = document.getElementById('replay');

  // Smooth opacity via rAF
  function fadeTo(el, target, ms, cb) {
    const start = performance.now();
    const from  = parseFloat(el.style.opacity) || 0;
    (function tick(now) {
      const p = Math.min((now - start) / ms, 1);
      const e = p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; // ease in-out quad
      el.style.opacity = from + (target - from) * e;
      if (p < 1) requestAnimationFrame(tick); else cb && cb();
    })(start);
  }

  function play() {
    replay.classList.remove('show');

    // Reset
    fBp.style.opacity = '0';
    fBu.style.opacity = '0';
    imgBp.style.animation = 'none';
    imgBu.style.animation = 'none';
    lblBp.classList.remove('show');
    lblBu.classList.remove('show');
    pd1.classList.remove('on'); pd2.classList.remove('on');

    void imgBp.offsetWidth; // reflow

    // Start blueprint Ken Burns
    imgBp.style.animation = 'kb-blueprint 8s linear forwards';

    // Fade in blueprint
    fadeTo(fBp, 1, 1000, () => {
      lblBp.classList.add('show');
      pd1.classList.add('on');

      // Hold 3.5s then transition
      setTimeout(() => {
        // Start built Ken Burns before reveal
        imgBu.style.animation = 'none';
        void imgBu.offsetWidth;
        imgBu.style.animation = 'kb-built 8s linear forwards';

        lblBp.classList.remove('show');

        // Crossfade: blueprint out, built in — simultaneous
        fadeTo(fBu, 1, 2200, () => {
          lblBu.classList.add('show');
          pd1.classList.remove('on');
          pd2.classList.add('on');
          setTimeout(() => replay.classList.add('show'), 2000);
        });
        fadeTo(fBp, 0, 2000, null);

      }, 3500);
    });
  }

  window.addEventListener('load', () => setTimeout(play, 400));
</script>
</body>
</html>
