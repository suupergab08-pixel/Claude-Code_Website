<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sights — Burj Khalifa</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#000;
  font-family:'DM Sans', sans-serif;
  color:#fff;
  overflow:hidden;
}

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:22px 48px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
}
.nav-logo {
  font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px;
  background:linear-gradient(135deg,#C6A559,#E6B979);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  text-decoration:none;
}
.nav-links { display:flex; gap:28px; list-style:none; }
.nav-links a {
  text-decoration:none; color:rgba(255,255,255,0.45);
  font-size:12px; letter-spacing:2px; text-transform:uppercase; transition:color .3s;
}
.nav-links a:hover, .nav-links a.active { color:#C6A559; }

/* FULL-SCREEN VIDEO */
#burj-video {
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:0;
}

/* OVERLAYS */
#vignette {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 80% 80% at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
}
#btm-fade {
  position:fixed; bottom:0; left:0; right:0; height:40%; z-index:1; pointer-events:none;
  background:linear-gradient(transparent, rgba(0,0,0,0.7));
}

/* LABEL */
#label {
  position:fixed; bottom:80px; left:48px; z-index:10;
  opacity:0; transform:translateY(14px);
  animation:fadeUp 1s ease 1s forwards;
}
.lbl-tag {
  font-size:10px; letter-spacing:4px; text-transform:uppercase;
  color:#C6A559; margin-bottom:10px;
}
#label h2 {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(56px,8vw,108px);
  letter-spacing:2px; line-height:.92;
  background:linear-gradient(135deg,#C6A559 0%,#E6B979 50%,#fff8e0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
#label p {
  margin-top:14px; font-size:14px; font-weight:300;
  color:rgba(255,255,255,0.4); max-width:340px; line-height:1.7;
}

@keyframes fadeUp {
  to { opacity:1; transform:translateY(0); }
}

@media (max-width:768px) {
  nav { padding:16px 20px; }
  .nav-links { display:none; }
  #label { left:20px; bottom:56px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">TesterTech</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="TesterTech.html">Products</a></li>
    <li><a href="creative.html">Creative</a></li>
    <li><a href="sights.html" class="active">Sights</a></li>
  </ul>
</nav>

<video id="burj-video" autoplay loop muted playsinline>
  <source src="burj.mp4" type="video/mp4">
</video>

<div id="vignette"></div>
<div id="btm-fade"></div>

<div id="label">
  <div class="lbl-tag">Burj Khalifa — Dubai, UAE</div>
  <h2>Burj<br>Khalifa</h2>
  <p>828 metres. The world's tallest structure.</p>
</div>

</body>
</html>
