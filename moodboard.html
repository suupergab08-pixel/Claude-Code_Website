<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodboard — Tester.io</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C6A559;--gold-light:#E6B979;--gold-dim:rgba(198,165,89,.15);
  --bg:#111014;--bg2:#1a181e;--bg3:#232127;
  --text:#e8e4dd;--text-dim:#9a958c;
  --radius:12px;
}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}

/* Navbar */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(17,16,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(198,165,89,.1)}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-brand img{height:28px}
.nav-brand span{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold)}
.nav-back{font-size:.85rem;color:var(--text-dim);transition:.3s}
.nav-back:hover{color:var(--gold)}

/* Main layout */
.main{padding:100px 40px 60px;max-width:1400px;margin:0 auto}

/* Header */
.header{text-align:center;margin-bottom:48px}
.header h1{font-family:'Playfair Display',serif;font-size:3.2rem;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-light),#fff,var(--gold));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s ease infinite}
.header p{color:var(--text-dim);margin-top:8px;font-size:.95rem;letter-spacing:.5px}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Form card */
.form-card{background:var(--bg2);border:1px solid rgba(198,165,89,.12);border-radius:16px;padding:36px;margin-bottom:40px;position:relative;overflow:hidden}
.form-card::before{content:'';position:absolute;top:-1px;left:30%;right:30%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.75rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);font-weight:600}
.field input,.field textarea{background:var(--bg);border:1px solid rgba(198,165,89,.15);border-radius:var(--radius);padding:14px 16px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:.9rem;transition:border .3s,box-shadow .3s;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-dim)}
.field textarea{resize:vertical;min-height:80px}
.btn-generate{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#111;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:1px;text-transform:uppercase;border:none;border-radius:var(--radius);cursor:pointer;transition:transform .2s,box-shadow .3s}
.btn-generate:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(198,165,89,.3)}
.btn-generate:active{transform:translateY(0)}
.btn-generate:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-generate svg{width:20px;height:20px}

/* Loading state */
.generating{position:relative;overflow:hidden}
.generating::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:loading-sweep 1.5s infinite}
@keyframes loading-sweep{to{left:100%}}

/* Prompts section */
.section-title{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-title .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block}
.prompts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:48px}
.prompt-card{background:var(--bg2);border:1px solid rgba(198,165,89,.08);border-radius:var(--radius);padding:20px;position:relative;transition:border .3s,transform .3s}
.prompt-card:hover{border-color:rgba(198,165,89,.25);transform:translateY(-2px)}
.prompt-card h3{font-size:.85rem;color:var(--gold);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.prompt-card p{font-size:.85rem;color:var(--text-dim);line-height:1.6}
.prompt-actions{display:flex;gap:8px;margin-top:12px}
.prompt-actions button{padding:6px 14px;font-size:.75rem;font-family:'Montserrat',sans-serif;font-weight:600;border-radius:8px;border:1px solid rgba(198,165,89,.2);background:transparent;color:var(--gold);cursor:pointer;transition:.3s}
.prompt-actions button:hover{background:var(--gold-dim);border-color:var(--gold)}
.prompt-actions .btn-gen-img{background:var(--gold);color:#111;border-color:var(--gold)}
.prompt-actions .btn-gen-img:hover{background:var(--gold-light)}

/* Images gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:48px}
.gallery-item{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--bg2);border:1px solid rgba(198,165,89,.08);aspect-ratio:16/9}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.gallery-item:hover img{transform:scale(1.03)}
.gallery-item .overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .3s}
.gallery-item:hover .overlay{opacity:1}
.gallery-item .overlay p{font-size:.75rem;color:var(--text-dim);line-height:1.4}
.gallery-loading{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-dim);font-size:.85rem}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* History sidebar */
.history{margin-top:60px;border-top:1px solid rgba(198,165,89,.1);padding-top:32px}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{background:var(--bg2);border:1px solid rgba(198,165,89,.06);border-radius:var(--radius);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.3s}
.history-item:hover{border-color:rgba(198,165,89,.2);background:var(--bg3)}
.history-item .meta{font-size:.8rem;color:var(--text-dim)}
.history-item .title{font-size:.9rem;font-weight:500}
.history-item .actions{display:flex;gap:6px}
.history-item .actions button{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;font-size:.8rem;transition:.3s}
.history-item .actions button:hover{color:var(--gold)}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.3}
.empty p{font-size:.9rem}

/* Mobile */
@media(max-width:768px){
  .main{padding:80px 16px 40px}
  .nav{padding:12px 16px}
  .header h1{font-size:2rem}
  .form-grid{grid-template-columns:1fr}
  .prompts-grid{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <img src="brand_assets/Tester Logo.png" alt="Tester.io">
    <span>Tester.io</span>
  </div>
  <a href="index.html" class="nav-back">&larr; Back to Home</a>
</nav>

<main class="main">
  <header class="header">
    <h1>Moodboard</h1>
    <p>Describe your vision and let AI generate stunning visual concepts</p>
  </header>

  <!-- Input Form -->
  <div class="form-card">
    <div class="form-grid">
      <div class="field">
        <label>Idea</label>
        <input type="text" id="idea" placeholder="e.g. A futuristic QA testing dashboard">
      </div>
      <div class="field">
        <label>Theme</label>
        <input type="text" id="theme" placeholder="e.g. Dark luxury, cyberpunk, minimalist">
      </div>
      <div class="field">
        <label>Products</label>
        <input type="text" id="products" placeholder="e.g. SaaS platform, mobile app, website">
      </div>
    </div>
    <button class="btn-generate" id="generateBtn" onclick="generate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Generate Now
    </button>
  </div>

  <!-- Generated Prompts -->
  <div id="promptsSection" style="display:none">
    <h2 class="section-title"><span class="dot"></span>Generated Prompts</h2>
    <div class="prompts-grid" id="promptsGrid"></div>
  </div>

  <!-- Generated Images -->
  <div id="imagesSection" style="display:none">
    <h2 class="section-title"><span class="dot"></span>Generated Images</h2>
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Saved History -->
  <div class="history">
    <h2 class="section-title"><span class="dot"></span>Saved Sessions</h2>
    <div id="historyList" class="history-list"></div>
    <div id="historyEmpty" class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      <p>No saved sessions yet. Generate your first moodboard above.</p>
    </div>
  </div>
</main>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:5001' : '';
const STORAGE_KEY = 'testerio_moodboard_sessions';

// Load saved sessions on startup
loadHistory();

async function generate() {
  const idea = document.getElementById('idea').value.trim();
  const theme = document.getElementById('theme').value.trim();
  const products = document.getElementById('products').value.trim();
  if (!idea) { alert('Please enter an idea'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.classList.add('generating');
  btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Generating prompts...';

  try {
    // Step 1: Generate prompts via backend (Groq)
    const res = await fetch(`${API}/api/moodboard/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idea, theme, products }),
    });
    if (!res.ok) throw new Error('Failed to generate prompts');
    const { prompts } = await res.json();
    if (!prompts.length) throw new Error('No prompts generated');

    // Display prompts
    displayPrompts(prompts);

    // Save session
    saveSession({ idea, theme, products, prompts, images: [], timestamp: Date.now() });

    // Step 2: Auto-generate images for all prompts
    btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Generating images...';
    await generateAllImages(prompts);

  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('generating');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> Generate Now';
  }
}

function displayPrompts(prompts) {
  const section = document.getElementById('promptsSection');
  const grid = document.getElementById('promptsGrid');
  section.style.display = 'block';
  grid.innerHTML = prompts.map((p, i) => `
    <div class="prompt-card">
      <h3>${p.title}</h3>
      <p>${p.prompt}</p>
      <div class="prompt-actions">
        <button onclick="copyPrompt(${i})" title="Copy prompt">Copy</button>
        <button class="btn-gen-img" onclick="generateSingleImage(${i})" title="Regenerate image">Regenerate</button>
      </div>
    </div>
  `).join('');
  window._currentPrompts = prompts;
}

async function generateAllImages(prompts) {
  const section = document.getElementById('imagesSection');
  const gallery = document.getElementById('gallery');
  section.style.display = 'block';

  // Create loading placeholders
  gallery.innerHTML = prompts.map((p, i) => `
    <div class="gallery-item" id="img-${i}">
      <div class="gallery-loading">
        <div class="spinner"></div>
        <span>Generating: ${p.title}...</span>
      </div>
    </div>
  `).join('');

  // Fire all image generations in parallel
  const tasks = await Promise.all(prompts.map(async (p) => {
    try {
      const res = await fetch(`${API}/api/moodboard/image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: p.prompt, aspect_ratio: '16:9' }),
      });
      if (!res.ok) throw new Error('Image API error');
      return await res.json();
    } catch (err) {
      return { error: err.message };
    }
  }));

  // Poll each task for completion
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].error) {
      document.getElementById(`img-${i}`).innerHTML = `<div class="gallery-loading"><span>Failed: ${tasks[i].error}</span></div>`;
      continue;
    }
    pollForImage(tasks[i].taskId, i, prompts[i]);
  }
}

async function pollForImage(taskId, index, promptData) {
  const el = document.getElementById(`img-${index}`);
  let attempts = 0;
  const maxAttempts = 60;

  const poll = async () => {
    if (attempts++ > maxAttempts) {
      el.innerHTML = '<div class="gallery-loading"><span>Timed out</span></div>';
      return;
    }
    try {
      const res = await fetch(`${API}/api/moodboard/status/${taskId}`);
      const data = await res.json();

      if (data.imageUrl) {
        el.innerHTML = `
          <img src="${data.imageUrl}" alt="${promptData.title}" loading="lazy">
          <div class="overlay"><p>${promptData.title}</p></div>
        `;
        // Update saved session with image
        updateSessionImage(index, data.imageUrl);
        return;
      }

      if (data.status === 'failed') {
        el.innerHTML = '<div class="gallery-loading"><span>Generation failed</span></div>';
        return;
      }

      // Still pending, poll again
      el.querySelector('span').textContent = `${promptData.title}... ${data.progress || 'processing'}`;
      setTimeout(poll, 3000);
    } catch {
      setTimeout(poll, 5000);
    }
  };
  poll();
}

async function generateSingleImage(index) {
  const prompt = window._currentPrompts[index];
  if (!prompt) return;
  const el = document.getElementById(`img-${index}`);
  if (el) {
    el.innerHTML = '<div class="gallery-loading"><div class="spinner"></div><span>Regenerating...</span></div>';
    try {
      const res = await fetch(`${API}/api/moodboard/image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt.prompt, aspect_ratio: '16:9' }),
      });
      const data = await res.json();
      if (data.taskId) pollForImage(data.taskId, index, prompt);
    } catch (err) {
      el.innerHTML = `<div class="gallery-loading"><span>Error: ${err.message}</span></div>`;
    }
  }
}

function copyPrompt(index) {
  const prompt = window._currentPrompts[index];
  if (prompt) {
    navigator.clipboard.writeText(prompt.prompt);
    const cards = document.querySelectorAll('.prompt-card');
    const btn = cards[index]?.querySelector('button');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  }
}

// --- Persistence ---
function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}

function saveSession(session) {
  const sessions = getSessions();
  sessions.unshift(session);
  if (sessions.length > 20) sessions.length = 20; // Keep max 20
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  loadHistory();
}

function updateSessionImage(index, imageUrl) {
  const sessions = getSessions();
  if (sessions[0]) {
    if (!sessions[0].images) sessions[0].images = [];
    sessions[0].images[index] = imageUrl;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }
}

function loadHistory() {
  const sessions = getSessions();
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');

  if (!sessions.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  list.innerHTML = sessions.map((s, i) => {
    const date = new Date(s.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const imgCount = (s.images || []).filter(Boolean).length;
    return `
      <div class="history-item" onclick="restoreSession(${i})">
        <div>
          <div class="title">${s.idea}</div>
          <div class="meta">${s.theme || 'No theme'} &middot; ${s.prompts?.length || 0} prompts &middot; ${imgCount} images</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="meta">${date}</span>
          <div class="actions">
            <button onclick="event.stopPropagation();deleteSession(${i})" title="Delete">&times;</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function restoreSession(index) {
  const sessions = getSessions();
  const s = sessions[index];
  if (!s) return;

  document.getElementById('idea').value = s.idea || '';
  document.getElementById('theme').value = s.theme || '';
  document.getElementById('products').value = s.products || '';

  if (s.prompts?.length) displayPrompts(s.prompts);
  if (s.images?.length) {
    const section = document.getElementById('imagesSection');
    const gallery = document.getElementById('gallery');
    section.style.display = 'block';
    gallery.innerHTML = s.images.map((url, i) => {
      if (!url) return '';
      const title = s.prompts?.[i]?.title || `Image ${i+1}`;
      return `
        <div class="gallery-item" id="img-${i}">
          <img src="${url}" alt="${title}" loading="lazy">
          <div class="overlay"><p>${title}</p></div>
        </div>
      `;
    }).join('');
  }
}

function deleteSession(index) {
  const sessions = getSessions();
  sessions.splice(index, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  loadHistory();
}
</script>
</body>
</html>
